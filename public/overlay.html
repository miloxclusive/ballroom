<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Ballroom · overlay</title>
</head>
<!--
  Overlay pour OBS / Streamlabs (Source "Navigateur", 800 x 250).
  Il n'y a AUCUN son ici : le stream montre ce qui passe,
  mais ce sont les viewers qui écoutent de leur côté avec le code.
  Options dans l'URL :  ?code=off  (cacher le code)   ?titre=off (flouter le titre)
-->
<body class="overlay">
<div class="ov hidden" id="ov">
  <img id="cover" alt="">
  <div class="ov-text">
    <div class="ov-label" id="label">En écoute</div>
    <div class="ov-title" id="title"></div>
    <div class="ov-author" id="author"></div>
    <div class="bar"><div class="track"><div class="fill" id="fill"></div></div></div>
    <div class="ov-join" id="join">Écoute avec nous sur <span id="host"></span> · code <b id="code"></b></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script>
  const $ = (s) => document.querySelector(s);
  const CODE = decodeURIComponent(location.pathname.split('/')[2] || '').toUpperCase();
  const opts = new URLSearchParams(location.search);
  if (opts.get('code') === 'off') $('#join').classList.add('hidden');
  if (opts.get('titre') === 'off') $('#ov').classList.add('hide-title');
  $('#code').textContent = CODE;
  $('#host').textContent = location.host;

  const socket = io();
  let state = null;
  socket.on('connect', async () => {
    await clock.sync(socket);
    socket.emit('room:watch', { code: CODE }, (res) => res.state && render(res.state));
  });
  socket.on('state', render);

  function render(s) {
    state = s;
    const item = s.queue[s.index];
    $('#ov').classList.toggle('hidden', !item);
    if (!item) return;
    $('#cover').src = art(item);
    $('#title').textContent = item.title;
    $('#author').textContent = item.author;
    $('#label').textContent = s.playing ? 'En écoute' : 'En pause';
    coverColor(art(item)).then((c) => c && document.documentElement.style.setProperty('--accent', c));
  }

  (function tick() {
    const item = state && state.queue[state.index];
    if (item && item.duration) {
      const r = Math.min(1, targetPosition(state) / item.duration);
      $('#fill').style.width = `${r * 100}%`;
    }
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
